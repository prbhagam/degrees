[build]
  base = "."
  publish = "apps/server/dist"
  functions = "apps/server/netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["packages/shared/**", "apps/server/**"]
  # No `timeout` override: the account is on a legacy plan (10s synchronous limit, no Background Functions).
  # generateActivity keeps itself inside 9s; set ACTIVITY_BACKGROUND=true only on a plan that allows both.

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
